name: CI · Frontend (Ionic/Angular)

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build-test-lint:
    name: Build · Lint · Test · Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # @football-manager/stencil is a `file:./stencil` symlink dep whose
      # dist/ + loader/ output is gitignored, so a clean checkout lacks it and
      # `npm ci` won't regenerate it (no `prepare` runs for a linked dep).
      # Without loader/, `ng test`/`ng build` can't resolve
      # `@football-manager/stencil/loader` (src/main.ts). Build it explicitly.
      - name: Build Stencil web-components package
        working-directory: frontend/stencil
        run: npm ci --no-audit --no-fund && npm run build

      - name: Lint (ng lint)
        run: npm run lint -- --format=stylish
        continue-on-error: false

      - name: Test + coverage (Karma headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Build production
        run: npx ng build --configuration=production

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: E2E · Cypress (Chrome + Firefox)
    runs-on: ubuntu-latest
    # Runs in parallel with build-test-lint — no `needs`. The two jobs touch
    # different concerns (unit vs end-to-end) and a failure in one should
    # not gate feedback on the other.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Cypress' binary (~250 MB) lives outside node_modules, so the npm
      # cache above does NOT cover it. Without this, every run re-downloads
      # the binary and adds ~30s.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: cypress-${{ runner.os }}-

      # Firefox is the second engine required by the CNSA multi-browser
      # rubric (Chrome + Firefox — different rendering engines, unlike Edge
      # which is Chromium too). browser-actions is the canonical action used
      # by Cypress' own examples.
      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install dependencies
        run: npm ci

      # Same reason as the build job: the Stencil package's loader/ output is
      # gitignored, and `ionic serve` (started by `npm run e2e:*`) compiles
      # src/main.ts which imports `@football-manager/stencil/loader`.
      - name: Build Stencil web-components package
        working-directory: frontend/stencil
        run: npm ci --no-audit --no-fund && npm run build

      # `npm run e2e:*` spins up the Firebase Auth Emulator (uses the
      # preinstalled OpenJDK on ubuntu-latest) + the ionic dev server +
      # cypress, then tears them down. See frontend/cypress.config.ts.
      - name: E2E · Chrome
        run: npm run e2e:chrome

      - name: E2E · Firefox
        # Run Firefox even if Chrome failed, so the report shows whether the
        # regression is browser-specific or universal.
        if: success() || failure()
        run: npm run e2e:firefox

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 14
