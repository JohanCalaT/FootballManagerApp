events { worker_connections 1024; }
http {
  include mime.types;
  server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API and the backend toggle to the YARP Gateway so the
    # browser stays same-origin and never deals with CORS. The SPA uses RELATIVE
    # paths (gatewayUrl is '' on purpose); without this nginx would answer these
    # itself — GET falls through to index.html, POST /config/backend gives 405.
    # The gateway URL is rendered at container start (see 05-listen-port.sh).
    # Mirrors the dev proxy.conf.js: /api and /config forwarded, paths preserved
    # (bare scheme://host in proxy_pass) so YARP sees the /api prefix intact.
    # Host is intentionally NOT overridden: nginx sends the Gateway's host,
    # which ACA ingress needs for host-based routing (== dev changeOrigin:true).
    location /api/ {
      proxy_pass ${GATEWAY_URL};
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /config/ {
      proxy_pass ${GATEWAY_URL};
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
  }
}
