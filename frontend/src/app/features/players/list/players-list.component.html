<ion-content class="players-content" [scrollEvents]="true">
  <app-home-header
    (loginRequested)="goToLogin()"
    (logoutRequested)="signOut()" />

  <app-home-hero [count]="store.total()" />

  @if (isAuthenticated()) {
    <app-home-action-bar
      (importRequested)="onImport()"
      (insertRequested)="onInsert()"
      (idealTeamRequested)="onIdealTeam()"
      (newsRequested)="onNews()"
      (publishNewsRequested)="onPublishNews()" />
  }

  <app-home-search (queryChange)="onSearchQueryChange($event)" />

  <app-home-grid
    [players]="store.players()"
    [loading]="store.loading()"
    [error]="store.error()"
    [query]="store.query()"
    [allLoaded]="store.allLoaded()"
    [canRegister]="canRegister()"
    (playerSelected)="onPlayerSelected($event)"
    (editRequested)="onEditPlayer($event)"
    (deleteRequested)="onDeletePlayer($event)"
    (loadMoreRequested)="onLoadMore($event)"
    (retryRequested)="onRetry()"
    (registerRequested)="goToRegister()" />
</ion-content>
