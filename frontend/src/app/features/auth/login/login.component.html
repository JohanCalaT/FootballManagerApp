<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-shell">
    <div class="auth-shell__glow" aria-hidden="true"></div>

    <main class="auth-card" data-testid="login-form">
      <header class="auth-card__head">
        <p class="t-label-sm auth-card__eyebrow">Football Manager</p>
        <h1 class="t-headline-lg auth-card__title">Iniciar sesión</h1>
        <p class="t-body-md auth-card__subtitle">
          Entra con tu correo o tu cuenta de Google para gestionar tus jugadores.
        </p>
      </header>

      <form class="auth-form" (submit)="submit($event)" novalidate>
        <label class="auth-field">
          <span class="t-label-lg auth-field__label">Correo</span>
          <input
            type="email"
            class="auth-input"
            autocomplete="email"
            inputmode="email"
            required
            [value]="email()"
            (input)="onEmailInput($event)"
            data-testid="login-email-input"
          />
        </label>

        <label class="auth-field">
          <span class="t-label-lg auth-field__label">Contraseña</span>
          <input
            type="password"
            class="auth-input"
            autocomplete="current-password"
            required
            [value]="password()"
            (input)="onPasswordInput($event)"
            data-testid="login-password-input"
          />
        </label>

        @if (errorMessage(); as message) {
          <p class="auth-error" role="alert" data-testid="login-error">{{ message }}</p>
        }

        <button
          type="submit"
          class="auth-button auth-button--primary"
          [disabled]="loading()"
          data-testid="login-submit-button"
        >
          {{ loading() ? 'Accediendo…' : 'Entrar' }}
        </button>
      </form>

      <div class="auth-divider" aria-hidden="true">
        <span class="t-label-sm">o continúa con</span>
      </div>

      <button
        type="button"
        class="auth-button auth-button--ghost"
        [disabled]="loading()"
        (click)="signInWithGoogle()"
        data-testid="login-google-button"
      >
        <svg class="auth-button__icon" aria-hidden="true" viewBox="0 0 18 18" width="18" height="18">
          <path fill="#EA4335" d="M9 3.5a5.5 5.5 0 013.86 1.56l2.7-2.7A9 9 0 000 9l3.18 2.46A5.5 5.5 0 019 3.5z" />
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 01-1.8 2.71l2.92 2.27A8.78 8.78 0 0017.64 9.2z" />
          <path fill="#FBBC05" d="M3.18 11.46A5.5 5.5 0 013 9c0-.85.15-1.68.4-2.46L.22 4.07A9 9 0 000 9c0 1.45.35 2.82.97 4.04l3.21-2.58z" />
          <path fill="#34A853" d="M9 18a8.62 8.62 0 005.96-2.18l-2.92-2.27a5.5 5.5 0 01-8.07-2.85L.97 13.04A9 9 0 009 18z" />
        </svg>
        Google
      </button>

      <p class="t-body-md auth-card__footer">
        ¿No tienes cuenta?
        <a routerLink="/auth/register" class="auth-link" data-testid="login-register-link">
          Crear cuenta
        </a>
      </p>
    </main>
  </div>
</ion-content>
