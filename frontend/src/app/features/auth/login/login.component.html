<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-shell">
    <div class="auth-shell__glow" aria-hidden="true"></div>

    <div class="auth-stack">
      <button
        type="button"
        class="auth-back"
        (click)="goBack()"
        aria-label="Volver al inicio"
        data-testid="auth-back-button"
      >
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M10 3l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Volver</span>
      </button>

      <main class="auth-card" data-testid="login-form">
      <div class="auth-logo" aria-hidden="true">
        <img src="assets/img/logo-football-manager.png" alt="" />
      </div>

      <header class="auth-card__head">
        <h1 class="t-headline-lg auth-card__title">Iniciar sesión</h1>
        <p class="t-body-md auth-card__subtitle">
          Entra con tu correo o con Google para gestionar tus jugadores.
        </p>
      </header>

      <form class="auth-form" (submit)="submit($event)" novalidate>
        <label class="auth-field">
          <span class="t-label-lg auth-field__label">Correo</span>
          <input
            type="email"
            class="auth-input"
            [class.auth-input--invalid]="emailError() !== null"
            autocomplete="email"
            inputmode="email"
            autofocus
            required
            [value]="email()"
            (input)="onEmailInput($event)"
            data-testid="login-email-input"
          />
          @if (emailError(); as message) {
            <p class="auth-field-error" role="alert" data-testid="login-email-error">
              <svg class="auth-error-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
                <path d="M8 4.5v4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                <circle cx="8" cy="11.2" r="0.9" fill="currentColor" />
              </svg>
              {{ message }}
            </p>
          }
        </label>

        <label class="auth-field">
          <div class="auth-field__row">
            <span class="t-label-lg auth-field__label">Contraseña</span>
            <a routerLink="/auth/forgot-password" class="auth-link t-label-lg" data-testid="login-forgot-link">
              ¿Olvidaste?
            </a>
          </div>
          <div class="auth-input-wrap">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              class="auth-input auth-input--with-toggle"
              [class.auth-input--invalid]="passwordError() !== null"
              autocomplete="current-password"
              required
              [value]="password()"
              (input)="onPasswordInput($event)"
              data-testid="login-password-input"
            />
            <button
              type="button"
              class="auth-input__toggle"
              tabindex="-1"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              data-testid="login-password-toggle"
            >
              @if (showPassword()) {
                <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
                  <path d="M3 3l14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                  <path d="M10 4.5c4 0 7.2 2.8 8 5.5-.5 1.7-1.7 3.2-3.2 4.3M5.4 5.6C3.7 6.7 2.4 8.3 2 10c.8 2.7 4 5.5 8 5.5 1.1 0 2.1-.2 3-.6"
                        fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
              } @else {
                <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
                  <path d="M2 10c.8-2.7 4-5.5 8-5.5s7.2 2.8 8 5.5c-.8 2.7-4 5.5-8 5.5S2.8 12.7 2 10z"
                        fill="none" stroke="currentColor" stroke-width="1.6" />
                  <circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6" />
                </svg>
              }
            </button>
          </div>
          @if (passwordError(); as message) {
            <p class="auth-field-error" role="alert" data-testid="login-password-error">
              <svg class="auth-error-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
                <path d="M8 4.5v4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                <circle cx="8" cy="11.2" r="0.9" fill="currentColor" />
              </svg>
              {{ message }}
            </p>
          }
        </label>

        @if (formError(); as message) {
          <p class="auth-form-error" role="alert" data-testid="login-error">
            <svg class="auth-error-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path d="M8 4.5v4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              <circle cx="8" cy="11.2" r="0.9" fill="currentColor" />
            </svg>
            <span>{{ message }}</span>
          </p>
        }

        <button
          type="submit"
          class="auth-button auth-button--primary"
          [disabled]="loading()"
          data-testid="login-submit-button"
        >
          @if (loading()) {
            <span class="auth-loader" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
            <span>Accediendo</span>
          } @else {
            <span>Entrar</span>
          }
        </button>
      </form>

      <div class="auth-divider" aria-hidden="true">
        <span class="t-label-sm">o continúa con</span>
      </div>

      <button
        type="button"
        class="auth-button auth-button--ghost"
        [disabled]="loading()"
        (click)="signInWithGoogle()"
        data-testid="login-google-button"
      >
        <!-- Monochrome G — keeps the dark-neon palette coherent on the ghost button. -->
        <svg class="auth-button__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M21.6 12.227c0-.709-.064-1.39-.182-2.045H12v3.868h5.382a4.6 4.6 0 0 1-1.995 3.018v2.51h3.227c1.886-1.738 2.986-4.296 2.986-7.351zM12 22c2.7 0 4.964-.895 6.618-2.422l-3.227-2.51c-.895.6-2.04.954-3.391.954-2.605 0-4.81-1.76-5.6-4.122H3.073v2.59A9.997 9.997 0 0 0 12 22zM6.4 13.9a6.018 6.018 0 0 1 0-3.8V7.51H3.073a9.997 9.997 0 0 0 0 8.98L6.4 13.9zM12 5.977c1.47 0 2.787.505 3.823 1.495l2.867-2.867C16.96 2.99 14.696 2 12 2A9.997 9.997 0 0 0 3.073 7.51L6.4 10.1C7.19 7.738 9.395 5.977 12 5.977z"/>
        </svg>
        Continuar con Google
      </button>

      <p class="t-body-md auth-card__footer">
        ¿No tienes cuenta?
        <a routerLink="/auth/register" class="auth-link" data-testid="login-register-link">
          Crear cuenta
        </a>
      </p>
    </main>
    </div>
  </div>
</ion-content>
