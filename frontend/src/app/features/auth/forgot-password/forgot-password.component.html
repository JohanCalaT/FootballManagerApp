<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-shell">
    <div class="auth-shell__glow" aria-hidden="true"></div>

    <main class="auth-card" data-testid="forgot-password-form">
      <div class="auth-logo" aria-hidden="true">
        <img src="assets/img/logo-football-manager.png" alt="" />
      </div>

      <header class="auth-card__head">
        <h1 class="t-headline-lg auth-card__title">Recuperar acceso</h1>
        <p class="t-body-md auth-card__subtitle">
          Te enviaremos un enlace por correo para que vuelvas a entrar.
        </p>
      </header>

      <form class="auth-form" (submit)="submit($event)" novalidate>
        <label class="auth-field">
          <span class="t-label-lg auth-field__label">Correo</span>
          <input
            type="email"
            class="auth-input"
            [class.auth-input--invalid]="emailError() !== null"
            autocomplete="email"
            inputmode="email"
            autofocus
            required
            [value]="email()"
            (input)="onEmailInput($event)"
            data-testid="forgot-password-email-input"
          />
          @if (emailError(); as message) {
            <p class="auth-field-error" role="alert" data-testid="forgot-password-email-error">
              <svg class="auth-error-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
                <path d="M8 4.5v4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                <circle cx="8" cy="11.2" r="0.9" fill="currentColor" />
              </svg>
              {{ message }}
            </p>
          }
        </label>

        @if (formError(); as message) {
          <p class="auth-form-error" role="alert" data-testid="forgot-password-error">
            <svg class="auth-error-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path d="M8 4.5v4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              <circle cx="8" cy="11.2" r="0.9" fill="currentColor" />
            </svg>
            <span>{{ message }}</span>
          </p>
        }

        @if (sent()) {
          <p class="auth-form-success" role="status" data-testid="forgot-password-success">
            <svg class="auth-error-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path d="M5 8.4l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Listo. Revisa tu bandeja de entrada (y la carpeta de spam).</span>
          </p>
        }

        <button
          type="submit"
          class="auth-button auth-button--primary"
          [disabled]="loading()"
          data-testid="forgot-password-submit-button"
        >
          @if (loading()) {
            <span class="auth-loader" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
            <span>Enviando</span>
          } @else {
            <span>Enviar enlace</span>
          }
        </button>
      </form>

      <p class="t-body-md auth-card__footer">
        <a routerLink="/auth/login" class="auth-link" data-testid="forgot-password-back-link">
          Volver a inicio de sesión
        </a>
      </p>
    </main>
  </div>
</ion-content>
